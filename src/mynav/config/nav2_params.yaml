amcl:  # AMCL 粒子滤波定位节点。
  ros__parameters:  # ROS 2 节点参数入口。
    alpha1: 0.2  # 旋转引起的旋转噪声，越大表示越不相信旋转里程计。
    alpha2: 0.2  # 平移引起的旋转噪声。
    alpha3: 0.2  # 平移引起的平移噪声。
    alpha4: 0.2  # 旋转引起的平移噪声。
    alpha5: 0.2  # 平移噪声的额外系数，通常用于全向机器人。
    base_frame_id: "base_footprint"  # 机器人底盘坐标系名称。
    beam_skip_distance: 0.5  # 激光束与地图障碍物相差超过此距离时可跳过，单位米。
    beam_skip_error_threshold: 0.9  # 被跳过的激光束比例超过此值时，取消跳过策略。
    beam_skip_threshold: 0.3  # 认为激光束异常、可以跳过的比例阈值。
    do_beamskip: false  # 是否启用激光束跳过功能。
    global_frame_id: "map"  # AMCL 发布定位结果所使用的全局地图坐标系。
    lambda_short: 0.1  # 短距离激光测量模型的衰减参数。
    laser_likelihood_max_dist: 2.0  # 激光模型查找最近障碍物的最大距离，单位米。
    laser_max_range: 100.0  # 使用的激光最大量程，-1 表示采用传感器报告的值。
    laser_min_range: -1.0  # 忽略小于此距离的激光值，-1 表示采用传感器报告的值。
    laser_model_type: "likelihood_field"  # 激光模型：按地图障碍物距离计算匹配概率。
    max_beams: 60  # 每次更新最多抽取多少条激光束。
    max_particles: 2000  # 粒子滤波器允许的最大粒子数，越大越精确但计算量越高。
    min_particles: 500  # 粒子滤波器允许的最小粒子数。
    odom_frame_id: "odom"  # 里程计坐标系名称。
    pf_err: 0.05  # 粒子滤波定位允许的误差。
    pf_z: 0.99  # 粒子滤波定位达到目标精度的置信度。
    recovery_alpha_fast: 0.0  # 快速定位失败恢复系数，0 表示关闭该恢复机制。
    recovery_alpha_slow: 0.0  # 慢速定位失败恢复系数，0 表示关闭该恢复机制。
    resample_interval: 1  # 每隔多少次更新重采样一次粒子。
    robot_model_type: "nav2_amcl::DifferentialMotionModel"  # 机器人运动模型：差速底盘。
    save_pose_rate: 0.5  # 保存机器人位姿的频率，单位 Hz。
    sigma_hit: 0.2  # 激光命中障碍物时的高斯噪声标准差，单位米。
    tf_broadcast: true  # 是否发布 map 到 odom 的 TF 变换。
    transform_tolerance: 1.0  # TF 时间容忍度，单位秒。
    update_min_a: 0.2  # 旋转超过此角度才更新定位，单位弧度。
    update_min_d: 0.25  # 平移超过此距离才更新定位，单位米。
    z_hit: 0.5  # 激光正确命中地图障碍物的概率权重。
    z_max: 0.05  # 激光达到最大量程的概率权重。
    z_rand: 0.5  # 激光随机噪声的概率权重。
    z_short: 0.05  # 激光提前遇到障碍物的概率权重。
    scan_topic: scan  # 激光扫描话题名称。
    # set_initial_pose: true
    # initial_pose_x: 0.0
    # initial_pose_y: 0.0
    # initial_pose_z: 0.0
    # initial_pose_yaw: 0.0
    # global_localization: false

bt_navigator:  # 行为树导航器节点。
  ros__parameters:  # ROS 2 节点参数入口。
    global_frame: map  # 行为树使用的全局坐标系。
    robot_base_frame: base_link  # 机器人底盘坐标系。
    odom_topic: /odom  # 里程计话题，用于行为树获取机器人运动状态。
    bt_loop_duration: 10  # 行为树循环周期，单位毫秒。
    default_server_timeout: 20  # 调用 Nav2 服务的默认超时时间，单位毫秒。
    wait_for_service_timeout: 1000  # 等待服务出现的最长时间，单位毫秒。
    action_server_result_timeout: 900.0  # Action 结果保留时间，单位秒。
    navigators: ["navigate_to_pose", "navigate_through_poses"]  # 启用的导航 Action 类型。
    navigate_to_pose:  # 单目标点导航器配置段。
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"  # 单目标点导航插件。
    navigate_through_poses:  # 多目标点导航器配置段。
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"  # 多目标点导航插件。
    # 以下两个行为树文件名留空时，使用 Nav2 自带的重规划和恢复行为树：
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # 也可以在这里指定，或由上层 launch 文件通过 RewrittenYaml 重写后传给 Nav2。

    # plugin_lib_names 用于添加自定义行为树插件；Nav2 内置插件会自动加载。
    # plugin_lib_names: []  # 如需自定义插件，可在这里填写插件库名称。

    error_code_names:  # 行为树可返回的错误码名称列表。
      - compute_path_error_code  # 计算路径失败时使用的错误码名称。
      - follow_path_error_code  # 跟踪路径失败时使用的错误码名称。

controller_server:  # 路径跟踪控制器节点。
  ros__parameters:  # ROS 2 节点参数入口。
    controller_frequency: 20.0  # 控制器计算速度指令的频率，单位 Hz。
    costmap_update_timeout: 0.30  # 等待代价地图更新的最长时间，单位秒。
    min_x_velocity_threshold: 0.001  # 忽略小于此值的前后方向速度，单位米/秒。
    min_y_velocity_threshold: 0.5  # 忽略小于此值的横向速度，差速车通常不使用横移。
    min_theta_velocity_threshold: 0.001  # 忽略小于此值的旋转速度，单位弧度/秒。
    failure_tolerance: 0.3  # 控制器允许的失败时间，单位秒。
    progress_checker_plugins: ["progress_checker"]  # 用于判断机器人是否正在前进的插件。
    goal_checker_plugins: ["general_goal_checker"] # 使用的目标到达判断插件。
    controller_plugins: ["FollowPath"]  # 使用的路径跟踪控制器列表。
    use_realtime_priority: false  # 是否尝试使用实时线程优先级。

    # 进度检查器参数。
    progress_checker:  # 进度检查器配置段。
      plugin: "nav2_controller::SimpleProgressChecker"  # 简单进度检查器。
      required_movement_radius: 0.5  # 在允许时间内至少移动的距离，单位米。
      movement_time_allowance: 10.0  # 允许机器人没有明显移动的时间，单位秒。
    # 目标检查器参数；下面是更严格的目标检查器示例，当前未启用。
    #precise_goal_checker:  # 更严格的目标检查器名称。
    #  plugin: "nav2_controller::SimpleGoalChecker"  # 目标检查器插件。
    #  xy_goal_tolerance: 0.25  # 位置容差，单位米。
    #  yaw_goal_tolerance: 0.25  # 朝向容差，单位弧度。
    #  stateful: True  # 是否保持已通过状态。
    general_goal_checker:  # 到达目标检查器配置段。
      stateful: True  # 到达位置后保持已通过状态，避免因噪声反复切换。
      plugin: "nav2_controller::SimpleGoalChecker"  # 简单目标检查器。
      xy_goal_tolerance: 0.25  # 位置误差允许范围，单位米。
      yaw_goal_tolerance: 0.25  # 朝向误差允许范围，单位弧度。
    FollowPath:  # FollowPath 控制器配置段。
      plugin: "nav2_mppi_controller::MPPIController"  # MPPI 采样式路径跟踪控制器。
      time_steps: 56  # 每条预测轨迹包含的时间步数。
      model_dt: 0.05  # 预测模型每一步的时间间隔，单位秒。
      batch_size: 2000  # 每轮采样的候选轨迹数量。
      ax_max: 3.0  # 最大前进加速度，单位米/秒平方。
      ax_min: -3.0  # 最大前进减速度，单位米/秒平方。
      ay_max: 3.0  # 最大横向加速度，单位米/秒平方。
      ay_min: -3.0  # 最小横向加速度，单位米/秒平方。
      az_max: 3.5  # 最大角加速度，单位弧度/秒平方。
      vx_std: 0.2  # 前进速度采样噪声标准差。
      vy_std: 0.2  # 横向速度采样噪声标准差。
      wz_std: 0.4  # 旋转速度采样噪声标准差。
      vx_max: 0.5  # 最大前进速度，单位米/秒。
      vx_min: -0.35  # 最大倒车速度，单位米/秒。
      vy_max: 0.5  # 最大横向速度；差速车通常无法使用。
      wz_max: 1.9  # 最大旋转速度，单位弧度/秒。
      iteration_count: 1  # 每次控制计算的 MPPI 优化迭代次数。
      prune_distance: 1.7  # 只保留距离机器人较近的路径部分，单位米。
      transform_tolerance: 0.1  # 坐标变换允许的时间误差，单位秒。
      temperature: 0.3  # MPPI 权重温度，影响候选轨迹权重分布。
      gamma: 0.015  # MPPI 控制代价的平滑系数。
      motion_model: "DiffDrive"  # 使用差速驱动运动模型。
      visualize: true  # 是否发布候选轨迹用于可视化。
      regenerate_noises: true  # 每次控制计算是否重新生成采样噪声。
      TrajectoryVisualizer:  # MPPI 候选轨迹可视化配置段。
        trajectory_step: 5  # 可视化时每隔多少条轨迹绘制一条。
        time_step: 3  # 可视化轨迹点的时间采样间隔。
      AckermannConstraints:  # 阿克曼运动约束配置段。
        min_turning_r: 0.2  # 阿克曼模型最小转弯半径，当前差速模型基本不使用。
      critics: [  # 按顺序启用的 MPPI 轨迹评价器列表。
        "ConstraintCritic", "CostCritic", "GoalCritic",  # 约束、碰撞和目标距离评价。
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",  # 目标朝向、路径对齐和路径跟随评价。
        "PathAngleCritic", "PreferForwardCritic"]  # 参与评价候选轨迹的代价函数。
      ConstraintCritic:  # 运动约束评价器配置段。
        enabled: true  # 是否启用运动约束评价。
        cost_power: 1  # 代价的幂次。
        cost_weight: 4.0  # 运动约束代价的权重。
      GoalCritic:  # 目标距离评价器配置段。
        enabled: true  # 是否启用目标距离评价。
        cost_power: 1  # 目标代价的幂次。
        cost_weight: 5.0  # 目标距离代价的权重。
        threshold_to_consider: 1.4  # 距离目标小于此值时才重点考虑目标代价，单位米。
      GoalAngleCritic:  # 目标朝向评价器配置段。
        enabled: true  # 是否启用目标朝向评价。
        cost_power: 1  # 朝向代价的幂次。
        cost_weight: 3.0  # 目标朝向代价的权重。
        threshold_to_consider: 0.5  # 距离目标小于此值时才考虑目标朝向，单位米。
      PreferForwardCritic:  # 向前行驶偏好评价器配置段。
        enabled: true  # 是否偏好向前行驶。
        cost_power: 1  # 偏好向前代价的幂次。
        cost_weight: 5.0  # 偏好向前代价的权重。
        threshold_to_consider: 0.5  # 距离目标小于此值时才启用该评价，单位米。
      CostCritic:  # 代价地图碰撞评价器配置段。
        enabled: true  # 是否根据代价地图评价碰撞风险。
        cost_power: 1  # 碰撞代价的幂次。
        cost_weight: 3.81  # 碰撞风险代价的权重。
        near_collision_cost: 253  # 接近碰撞时的代价地图阈值。
        critical_cost: 300.0  # 认为轨迹危险的代价阈值。
        consider_footprint: false  # 是否用完整机器人轮廓而不是中心点检查碰撞。
        collision_cost: 1000000.0  # 发生碰撞时施加的极大惩罚。
        near_goal_distance: 1.0  # 距离目标小于此值时使用近目标策略，单位米。
        trajectory_point_step: 2  # 每隔多少个轨迹点检查一次代价地图。
      PathAlignCritic:  # 路径横向对齐评价器配置段。
        enabled: true  # 是否评价候选轨迹与全局路径的横向对齐程度。
        cost_power: 1  # 路径对齐代价的幂次。
        cost_weight: 14.0  # 路径对齐代价的权重。
        max_path_occupancy_ratio: 0.05  # 路径被障碍物占据的最大比例。
        trajectory_point_step: 4  # 每隔多少个轨迹点评价一次路径对齐。
        threshold_to_consider: 0.5  # 距离目标小于此值时不再重点对齐路径，单位米。
        offset_from_furthest: 20  # 从轨迹最远点向前取样的偏移量。
        use_path_orientations: false  # 是否同时使用全局路径提供的朝向。
      PathFollowCritic:  # 路径跟随评价器配置段。
        enabled: true  # 是否评价候选轨迹跟随全局路径的程度。
        cost_power: 1  # 路径跟随代价的幂次。
        cost_weight: 5.0  # 路径跟随代价的权重。
        offset_from_furthest: 5  # 从轨迹最远点向前取样的偏移量。
        threshold_to_consider: 1.4  # 距离目标小于此值时不再重点跟随路径，单位米。
      PathAngleCritic:  # 路径朝向评价器配置段。
        enabled: true  # 是否评价轨迹朝向与路径朝向的一致性。
        cost_power: 1  # 路径角度代价的幂次。
        cost_weight: 2.0  # 路径角度代价的权重。
        offset_from_furthest: 4  # 从轨迹最远点向前取样的偏移量。
        threshold_to_consider: 0.5  # 距离目标小于此值时不再重点考虑路径角度，单位米。
        max_angle_to_furthest: 1.0  # 允许的最大路径角度差，单位弧度。
        mode: 0  # 路径角度评价模式。
      # TwirlingCritic:  # 原地打转评价器示例，当前未启用。
      #   enabled: true  # 是否启用原地打转评价。
      #   twirling_cost_power: 1  # 原地打转代价的幂次。
      #   twirling_cost_weight: 10.0  # 原地打转代价权重。

local_costmap:  # 局部代价地图节点容器。
  local_costmap:  # 局部代价地图实际节点。
    ros__parameters:  # ROS 2 节点参数入口。
      update_frequency: 5.0  # 局部代价地图的计算更新频率，单位 Hz。
      publish_frequency: 2.0  # 局部代价地图向外发布的频率，单位 Hz。
      global_frame: odom  # 局部地图所在坐标系，通常使用连续的 odom。
      robot_base_frame: base_link  # 机器人底盘坐标系。
      rolling_window: true  # 地图窗口是否跟随机器人移动。
      width: 3  # 局部地图宽度，单位米。
      height: 3  # 局部地图高度，单位米。
      resolution: 0.05  # 栅格分辨率，每个格子代表 0.05 米。
      robot_radius: 0.22  # 机器人碰撞半径，单位米。
      plugins: ["voxel_layer", "inflation_layer"]  # 局部地图启用的图层。
      inflation_layer:  # 局部地图障碍物膨胀层配置段。
        plugin: "nav2_costmap_2d::InflationLayer"  # 障碍物膨胀图层插件。
        cost_scaling_factor: 3.0  # 距离障碍物越远，代价下降的速度。
        inflation_radius: 0.70  # 障碍物影响范围，单位米。
      voxel_layer:  # 局部地图三维体素层配置段。
        plugin: "nav2_costmap_2d::VoxelLayer"  # 使用三维体素记录障碍物的图层。
        enabled: True  # 是否启用体素图层。
        publish_voxel_map: True  # 是否发布体素地图用于调试和可视化。
        origin_z: 0.0  # 体素地图的高度起点，单位米。
        z_resolution: 0.05  # 每个体素在垂直方向的尺寸，单位米。
        z_voxels: 16  # 垂直方向的体素层数。
        max_obstacle_height: 2.0  # 最高考虑的障碍物高度，单位米。
        mark_threshold: 0  # 判定栅格为障碍物所需的体素数量阈值。
        observation_sources: scan  # 障碍物观测来源名称。
        scan:  # 体素层使用的激光观测配置段。
          topic: /scan  # 激光扫描话题。
          max_obstacle_height: 2.0  # 该传感器可标记的最高障碍物，单位米。
          clearing: True  # 激光空旷方向是否清除旧障碍物。
          marking: True  # 激光检测到障碍物时是否标记障碍物。
          data_type: "LaserScan"  # 输入消息类型。
          raytrace_max_range: 3.0  # 清障射线的最大距离，单位米。
          raytrace_min_range: 0.0  # 清障射线的最小距离，单位米。
          obstacle_max_range: 2.5  # 标记障碍物的最大距离，单位米。
          obstacle_min_range: 0.0  # 标记障碍物的最小距离，单位米。
      static_layer:  # 局部地图静态地图层配置段。
        plugin: "nav2_costmap_2d::StaticLayer"  # 从静态地图服务器读取地图的图层。
        map_subscribe_transient_local: True  # 使用瞬态本地订阅，确保能收到已发布的地图。
      always_send_full_costmap: True  # 每次发布完整代价地图，而不是只发更新区域。

global_costmap:  # 全局代价地图节点容器。
  global_costmap:  # 全局代价地图实际节点。
    ros__parameters:  # ROS 2 节点参数入口。
      update_frequency: 1.0  # 全局代价地图的计算更新频率，单位 Hz。
      publish_frequency: 1.0  # 全局代价地图的发布频率，单位 Hz。
      global_frame: map  # 全局代价地图所在的地图坐标系。
      robot_base_frame: base_link  # 机器人底盘坐标系。
      robot_radius: 0.22  # 机器人碰撞半径，单位米。
      resolution: 0.05  # 栅格分辨率，每个格子代表 0.05 米。
      track_unknown_space: true  # 是否保留并区分未知区域。
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]  # 全局地图启用的图层。
      obstacle_layer:  # 全局地图传感器障碍物层配置段。
        plugin: "nav2_costmap_2d::ObstacleLayer"  # 使用传感器数据记录二维障碍物的图层。
        # footprint_clearing_enabled: true # 每次更新代价地图时，清除机器人自身轮廓范围内的障碍物标记。
        enabled: True  # 是否启用障碍物图层。
        observation_sources: scan  # 障碍物观测来源名称。
        scan:  # 障碍物层使用的激光观测配置段。
          topic: /scan  # 激光扫描话题。
          max_obstacle_height: 2.0  # 最高考虑的障碍物高度，单位米。
          clearing: True  # 是否用激光空旷方向清除旧障碍物。
          marking: True  # 是否用激光检测结果标记障碍物。
          data_type: "LaserScan"  # 输入消息类型。
          raytrace_max_range: 3.0  # 清障射线最大距离，单位米。
          raytrace_min_range: 0.0  # 清障射线最小距离，单位米。
          obstacle_max_range: 2.5  # 标记障碍物最大距离，单位米。
          obstacle_min_range: 0.0  # 标记障碍物最小距离，单位米。
      static_layer:  # 全局地图静态地图层配置段。
        plugin: "nav2_costmap_2d::StaticLayer"  # 读取静态地图的图层。
        map_subscribe_transient_local: True  # 确保能收到已发布的地图。
      inflation_layer:  # 全局地图障碍物膨胀层配置段。
        plugin: "nav2_costmap_2d::InflationLayer"  # 将障碍物影响范围向外膨胀的图层。
        cost_scaling_factor: 3.0  # 膨胀代价随距离下降的速度。
        inflation_radius: 0.7  # 障碍物影响范围，单位米。
      always_send_full_costmap: True  # 每次发布完整代价地图。

# 地图文件路径通常由 launch 文件或命令行传入，所以这里默认不需要填写。
# 如果要在本文件中指定地图，请移除 launch 文件中的默认地图参数，并填写下面的绝对路径。
# 命令行或 launch 文件传入的地图配置优先级更高。
# map_server:
#   ros__parameters:
#     yaml_filename: ""  # 静态地图 YAML 文件的完整路径。

map_saver:  # 地图保存节点。
  ros__parameters:  # ROS 2 节点参数入口。
    save_map_timeout: 5.0  # 保存地图等待服务完成的最长时间，单位秒。
    free_thresh_default: 0.25  # 栅格被判定为空闲的默认概率阈值。
    occupied_thresh_default: 0.65  # 栅格被判定为占用的默认概率阈值。
    map_subscribe_transient_local: True  # 确保能收到已发布的地图。

planner_server:  # 全局路径规划器节点。
  ros__parameters:  # ROS 2 节点参数入口。
    expected_planner_frequency: 20.0  # 规划器期望的计算频率，单位 Hz。
    planner_plugins: ["GridBased"]  # 使用的全局路径规划器列表。
    costmap_update_timeout: 1.0  # 等待代价地图更新的最长时间，单位秒。
    GridBased:  # 栅格规划器配置段。
      plugin: "nav2_navfn_planner::NavfnPlanner"  # NavFn 栅格路径规划器。
      tolerance: 0.5  # 目标点附近允许规划到达的容差，单位米。
      use_astar: false  # false 使用 Dijkstra，true 使用 A* 搜索。
      allow_unknown: true  # 是否允许路径经过未知区域。

smoother_server:  # 路径平滑器节点。
  ros__parameters:  # ROS 2 节点参数入口。
    smoother_plugins: ["simple_smoother"]  # 使用的路径平滑器列表。
    simple_smoother:  # 简单平滑器配置段。
      plugin: "nav2_smoother::SimpleSmoother"  # Nav2 内置简单路径平滑器。
      tolerance: 1.0e-10  # 平滑优化收敛的误差阈值。
      max_its: 1000  # 平滑优化允许的最大迭代次数。
      do_refinement: True  # 是否在主平滑后再次细化路径。

behavior_server:  # 恢复行为服务器节点。
  ros__parameters:  # ROS 2 节点参数入口。
    local_costmap_topic: local_costmap/costmap_raw  # 行为服务器使用的局部代价地图话题。
    global_costmap_topic: global_costmap/costmap_raw  # 行为服务器使用的全局代价地图话题。
    local_footprint_topic: local_costmap/published_footprint  # 局部机器人轮廓话题。
    global_footprint_topic: global_costmap/published_footprint  # 全局机器人轮廓话题。
    cycle_frequency: 10.0  # 行为服务器处理循环频率，单位 Hz。
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]  # 启用的恢复行为。
    spin:  # 原地旋转行为配置段。
      plugin: "nav2_behaviors::Spin"  # 原地旋转行为。
    backup:  # 倒车行为配置段。
      plugin: "nav2_behaviors::BackUp"  # 倒车行为。
    drive_on_heading:  # 指定方向行驶行为配置段。
      plugin: "nav2_behaviors::DriveOnHeading"  # 沿指定方向行驶行为。
    wait:  # 等待行为配置段。
      plugin: "nav2_behaviors::Wait"  # 原地等待行为。
    assisted_teleop:  # 辅助遥控行为配置段。
      plugin: "nav2_behaviors::AssistedTeleop"  # 辅助遥控行为。
    local_frame: odom  # 局部行为使用的坐标系。
    global_frame: map  # 全局行为使用的坐标系。
    robot_base_frame: base_link  # 机器人底盘坐标系。
    transform_tolerance: 0.1  # TF 时间容忍度，单位秒。
    simulate_ahead_time: 2.0  # 行为碰撞检查向前模拟的时间，单位秒。
    max_rotational_vel: 1.0  # 恢复行为最大旋转速度，单位弧度/秒。
    min_rotational_vel: 0.4  # 恢复行为最小旋转速度，单位弧度/秒。
    rotational_acc_lim: 3.2  # 恢复行为最大旋转加速度，单位弧度/秒平方。

waypoint_follower:  # 路点跟随节点。
  ros__parameters:  # ROS 2 节点参数入口。
    loop_rate: 20  # 路点跟随处理频率，单位 Hz。
    stop_on_failure: false  # 某个路点失败时是否停止后续路点任务。
    action_server_result_timeout: 900.0  # Action 结果保留时间，单位秒。
    waypoint_task_executor_plugin: "wait_at_waypoint"  # 到达路点后执行的任务插件。
    wait_at_waypoint:  # 到达路点后的等待任务配置段。
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # 到达路点后等待插件。
      enabled: True  # 是否启用到达路点等待。
      waypoint_pause_duration: 200  # 每个路点暂停时间，单位毫秒。

route_server:  # 路网导航服务器节点。
  ros__parameters:  # ROS 2 节点参数入口。
    # 路网文件通常由 launch 文件传入，所以这里默认不填写。
    # 如果要在本文件指定路网，请删除 launch 文件中的默认 graph 参数，并填写完整路径。
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson  # GeoJSON 路网文件路径。
    boundary_radius_to_achieve_node: 1.0  # 进入节点边界多近才算到达，单位米。
    radius_to_achieve_node: 2.0  # 路径规划认为已到达节点的半径，单位米。
    smooth_corners: true  # 是否平滑路网中的转角。
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]  # 启用的路网操作插件。
    ReroutingService:  # 重新规划服务配置段。
      plugin: "nav2_route::ReroutingService"  # 路径受阻时重新规划路线。
    AdjustSpeedLimit:  # 速度限制调整配置段。
      plugin: "nav2_route::AdjustSpeedLimit"  # 根据路网规则调整速度限制。
    CollisionMonitor:  # 路网碰撞监控配置段。
      plugin: "nav2_route::CollisionMonitor"  # 检查路线上潜在碰撞。
      max_collision_dist: 3.0  # 最大碰撞检查距离，单位米。
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]  # 评价路网边代价的插件。
    DistanceScorer:  # 距离代价评价器配置段。
      plugin: "nav2_route::DistanceScorer"  # 按路段距离计算代价。
    CostmapScorer:  # 代价地图评价器配置段。
      plugin: "nav2_route::CostmapScorer"  # 按代价地图风险计算代价。

velocity_smoother:  # 速度指令平滑节点。
  ros__parameters:  # ROS 2 节点参数入口。
    smoothing_frequency: 20.0  # 速度平滑输出频率，单位 Hz。
    stamp_smoothed_velocity_with_smoothing_time: False  # 是否用平滑时间戳覆盖输入时间戳。
    scale_velocities: False  # 超出限制时是否按比例缩放所有速度分量。
    feedback: "OPEN_LOOP"  # 速度反馈模式：OPEN_LOOP 表示主要依赖输入指令。
    max_velocity: [0.5, 0.0, 2.0]  # 最大速度 [前进、横向、旋转]，单位分别为米/秒、米/秒、弧度/秒。
    min_velocity: [-0.5, 0.0, -2.0]  # 最小速度 [前进、横向、旋转]。
    max_accel: [2.5, 0.0, 3.2]  # 最大加速度 [前进、横向、旋转]。
    max_decel: [-2.5, 0.0, -3.2]  # 最大减速度 [前进、横向、旋转]。
    odom_topic: "odom"  # 用于速度反馈的里程计话题。
    odom_duration: 0.1  # 里程计速度有效时间，单位秒。
    deadband_velocity: [0.0, 0.0, 0.0]  # 小于这些值的速度会被置零。
    velocity_timeout: 1.0  # 超过此时间没有新速度指令就停止，单位秒。

collision_monitor:  # 独立碰撞监控节点。
  ros__parameters:  # ROS 2 节点参数入口。
    base_frame_id: "base_footprint"  # 碰撞监控使用的机器人底盘坐标系。
    odom_frame_id: "odom"  # 里程计坐标系名称。
    cmd_vel_in_topic: "cmd_vel_smoothed"  # 碰撞检查前接收的速度指令话题。
    cmd_vel_out_topic: "cmd_vel"  # 通过碰撞检查后发布的速度指令话题。
    state_topic: "collision_monitor_state"  # 碰撞监控状态发布话题。
    transform_tolerance: 0.2  # TF 时间容忍度，单位秒。
    source_timeout: 1.0  # 传感器数据超过此时间未更新就认为失效，单位秒。
    base_shift_correction: True  # 是否修正机器人底盘移动造成的观测偏移。
    stop_pub_timeout: 2.0  # 停止指令持续发布的时间，单位秒。
    # polygons 定义机器人周围的碰撞检查区域；不同 action_type 可实现停止、减速或接近检测。
    polygons: ["FootprintApproach"]  # 启用的碰撞区域名称。
    FootprintApproach:  # 机器人轮廓接近碰撞区域配置段。
      type: "polygon"  # 区域类型：多边形。
      action_type: "approach"  # 检测接近碰撞，而不是直接停止机器人。
      footprint_topic: "/local_costmap/published_footprint"  # 机器人轮廓来源话题。
      time_before_collision: 1.2  # 预测未来多少秒内可能发生碰撞，单位秒。
      simulation_time_step: 0.1  # 碰撞预测的时间步长，单位秒。
      min_points: 6  # 多边形至少需要的边界点数量。
      visualize: False  # 是否发布该区域用于可视化。
      enabled: True  # 是否启用该碰撞区域。
    observation_sources: ["scan"]  # 用于碰撞检测的传感器来源列表。
    scan:  # 碰撞监控激光观测配置段。
      type: "scan"  # 观测类型：二维激光扫描。
      topic: "scan"  # 激光扫描话题名称。
      min_height: 0.15  # 参与碰撞检测的最低激光高度，单位米。
      max_height: 2.0  # 参与碰撞检测的最高激光高度，单位米。
      enabled: True  # 是否启用该激光观测源。

docking_server:  # 自动充电桩对接节点。
  ros__parameters:  # ROS 2 节点参数入口。
    controller_frequency: 50.0  # 对接控制器频率，单位 Hz。
    initial_perception_timeout: 5.0  # 初始寻找充电桩的最长时间，单位秒。
    wait_charge_timeout: 5.0  # 等待确认充电的最长时间，单位秒。
    dock_approach_timeout: 30.0  # 接近充电桩的最长时间，单位秒。
    undock_linear_tolerance: 0.05  # 判定完成直线离桩的距离，单位米。
    undock_angular_tolerance: 0.1  # 判定完成旋转离桩的角度，单位弧度。
    max_retries: 3  # 对接失败后的最大重试次数。
    base_frame: "base_link"  # 机器人底盘坐标系。
    fixed_frame: "odom"  # 对接控制使用的固定参考坐标系。
    dock_backwards: false  # 是否倒车进入充电桩。
    dock_prestaging_tolerance: 0.5  # 开始最终对接前允许的预停靠误差，单位米。

    # 充电桩类型及其对应的插件。
    dock_plugins: ['simple_charging_dock']  # 当前启用的充电桩插件列表。
    simple_charging_dock:  # 简单充电桩插件配置段。
      plugin: 'opennav_docking::SimpleChargingDock'  # 简单充电桩插件。
      docking_threshold: 0.05  # 认为已经对接成功的位置误差，单位米。
      staging_x_offset: -0.7  # 最终对接前的预停靠点纵向偏移，单位米。
      use_external_detection_pose: true  # 是否使用外部传感器提供的充电桩位姿。
      use_battery_status: false # 是否根据电池状态确认充电，当前关闭。
      use_stall_detection: false # 是否根据电机堵转确认对接，当前关闭。

      external_detection_timeout: 1.0  # 外部检测位姿的超时时间，单位秒。
      external_detection_translation_x: -0.18  # 外部检测坐标到充电桩坐标的 X 偏移，单位米。
      external_detection_translation_y: 0.0  # 外部检测坐标到充电桩坐标的 Y 偏移，单位米。
      external_detection_rotation_roll: -1.57  # 外部检测坐标的横滚角修正，单位弧度。
      external_detection_rotation_pitch: -1.57  # 外部检测坐标的俯仰角修正，单位弧度。
      external_detection_rotation_yaw: 0.0  # 外部检测坐标的偏航角修正，单位弧度。
      filter_coef: 0.1  # 外部检测位姿低通滤波系数。

    # 下面是充电桩实例配置示例；如果有多个充电桩，可取消注释并填写各自位姿。
    # docks: ['home_dock']  # 充电桩实例名称列表。
    # home_dock:  # 一个名为 home_dock 的充电桩实例。
    #   type: 'simple_charging_dock'  # 实例使用的充电桩插件类型。
    #   frame: map  # 位姿所在坐标系。
    #   pose: [0.0, 0.0, 0.0]  # 充电桩位姿 [x, y, yaw]。

    controller:  # 充电桩对接控制器配置段。
      k_phi: 3.0  # 对接控制器的朝向误差增益。
      k_delta: 2.0  # 对接控制器的横向误差增益。
      v_linear_min: 0.15  # 对接时最小线速度，单位米/秒。
      v_linear_max: 0.15  # 对接时最大线速度，单位米/秒。
      use_collision_detection: true  # 对接过程中是否检查碰撞。
      costmap_topic: "local_costmap/costmap_raw"  # 用于碰撞检查的局部代价地图话题。
      footprint_topic: "local_costmap/published_footprint"  # 用于碰撞检查的机器人轮廓话题。
      transform_tolerance: 0.1  # 坐标变换允许的时间误差，单位秒。
      projection_time: 5.0  # 对接轨迹向前预测的时间，单位秒。
      simulation_step: 0.1  # 对接轨迹模拟步长，单位秒。
      dock_collision_threshold: 0.3  # 对接碰撞检查的代价阈值。

loopback_simulator:  # 激光回环模拟器节点。
  ros__parameters:  # ROS 2 节点参数入口。
    base_frame_id: "base_footprint"  # 机器人底盘坐标系。
    odom_frame_id: "odom"  # 里程计坐标系。
    map_frame_id: "map"  # 地图坐标系。
    scan_frame_id: "base_scan"  # 激光坐标系，launch 文件可将其重映射为实际传感器坐标系。
    update_duration: 0.02  # 模拟器更新周期，单位秒。
    scan_range_min: 0.05  # 模拟激光最小量程，单位米。
    scan_range_max: 30.0  # 模拟激光最大量程，单位米。
    scan_angle_min: -3.1415  # 激光最小扫描角度，单位弧度。
    scan_angle_max: 3.1415  # 激光最大扫描角度，单位弧度。
    scan_angle_increment: 0.02617  # 激光相邻束之间的角度间隔，单位弧度。
    scan_use_inf: true  # 无回波时是否发布无穷大距离。